name: Release

# `git tag v0.1.0 && git push --tags` produz o release completo (F09-07): compila nos 3
# SOs, assina (F09-02) quando os certificados estão nos segredos, roda o teste de fumaça
# no pacote de verdade, publica com notas geradas dos commits e o `latest.json` do updater
# (F09-03). O release nasce rascunho e só é publicado quando os três SOs passaram: o
# updater nunca vê um release pela metade.
#
# Segredos (Settings → Secrets and variables → Actions), todos opcionais exceto o par do
# updater — sem eles o build sai sem a assinatura correspondente, com aviso nas notas:
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD  (updater; obrigatórios)
#   AISENSE_UPDATER_PUBKEY                                          (updater; obrigatório)
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY,
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                          (macOS: assinar e notarizar)
#   WINDOWS_CERTIFICATE, WINDOWS_CERTIFICATE_PASSWORD                (Windows: Authenticode, .pfx em base64)
# Passo a passo em docs/distribuicao.md.

on:
  push:
    tags: ['v*']
  # Ensaio: compila, empacota e roda a fumaça nos 3 SOs sem publicar nada (F09-01). Os
  # pacotes ficam como artefatos da execução, para instalar à mão.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  draft:
    name: Rascunho do release
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: A tag bate com a versão do app
        run: |
          tag="${GITHUB_REF_NAME#v}"
          app=$(node -p "require('./crates/aisense-app/tauri.conf.json').version")
          cargo=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$tag" != "$app" ] || [ "$tag" != "$cargo" ]; then
            echo "::error::tag $GITHUB_REF_NAME, tauri.conf.json $app, Cargo.toml $cargo: suba a versão nos dois antes de criar a tag"
            exit 1
          fi

      - name: Segredos do updater presentes
        env:
          KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          PUB: ${{ secrets.AISENSE_UPDATER_PUBKEY }}
        run: |
          if [ -z "$KEY" ] || [ -z "$PUB" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY e AISENSE_UPDATER_PUBKEY são obrigatórios (docs/distribuicao.md)"
            exit 1
          fi

      - name: Notas a partir dos commits
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > notes.md

      - name: Criar o rascunho
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "AISENSE ${GITHUB_REF_NAME}" --notes-file notes.md
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" --jq ".[] | select(.tag_name == \"${GITHUB_REF_NAME}\") | .id")
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build:
    name: Pacote (${{ matrix.name }})
    needs: draft
    # No ensaio o rascunho não roda; o pacote roda mesmo assim.
    if: ${{ !cancelled() && (needs.draft.result == 'success' || github.event_name == 'workflow_dispatch') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS universal
            os: macos-latest
            target: universal-apple-darwin
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
          - name: Linux x64
            # A glibc mais antiga disponível: o AppImage e o .deb rodam do 22.04 em diante.
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rust_targets: ''
          - name: Windows x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            rust_targets: ''
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}

      - name: Dependências de sistema (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev patchelf xvfb

      - run: pnpm install --frozen-lockfile

      - name: Sidecars (aisense, aisense-mcp)
        run: node scripts/sidecars.mjs --target ${{ matrix.target }}

      # F09-02, Windows: importa o .pfx e passa a impressão digital ao empacotador.
      - name: Certificado Authenticode (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_CERTIFICATE) {
            Write-Output "::warning::WINDOWS_CERTIFICATE ausente: instalador sem assinatura (SmartScreen vai avisar)"
            '{}' | Set-Content crates/aisense-app/tauri.signing.conf.json
            exit 0
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'aisense.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx
          @{ bundle = @{ windows = @{
            certificateThumbprint = $cert.Thumbprint
            digestAlgorithm = 'sha256'
            timestampUrl = 'http://timestamp.digicert.com'
          } } } | ConvertTo-Json -Depth 5 | Set-Content crates/aisense-app/tauri.signing.conf.json

      - name: Sem configuração de assinatura extra (macOS e Linux)
        if: runner.os != 'Windows'
        run: echo '{}' > crates/aisense-app/tauri.signing.conf.json

      - name: Aviso de macOS sem certificado
        if: runner.os == 'macOS'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE ausente: app sem assinatura nem notarização (Gatekeeper vai bloquear)"
          fi

      # No ensaio não há chave do updater: os artefatos `.sig` e o `latest.json` ficam de fora.
      # A chave pública vai para `plugins.updater.pubkey`: o CLI a exige para assinar os
      # artefatos, e o app a lê dali para conferir cada atualização (F09-03).
      - name: Configurações do empacotamento
        id: configs
        shell: bash
        env:
          AISENSE_UPDATER_PUBKEY: ${{ secrets.AISENSE_UPDATER_PUBKEY }}
        run: |
          args="--target ${{ matrix.target }} --config crates/aisense-app/tauri.bundle.conf.json"
          if [ "${{ github.event_name }}" = "push" ]; then
            node scripts/release-config.mjs > crates/aisense-app/tauri.release.conf.json
            args="$args --config crates/aisense-app/tauri.release.conf.json"
          fi
          echo "args=$args --config crates/aisense-app/tauri.signing.conf.json" >> "$GITHUB_OUTPUT"

      - name: Compilar, assinar e anexar ao release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Updater (F09-03): assina os artefatos com a chave privada.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS (F09-02): o tauri-action importa o certificado, assina e notariza.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          releaseId: ${{ needs.draft.outputs.release_id }}
          projectPath: .
          tauriScript: pnpm tauri
          args: ${{ steps.configs.outputs.args }}
          includeUpdaterJson: ${{ github.event_name == 'push' }}
          updaterJsonPreferNsis: true

      # O risco da fase: o sidecar sem permissão de execução depois de empacotado. Aqui o
      # app instalado sobe um agente que roda `aisense whoami` e o `aisense-mcp`.
      - name: Fumaça — instalar o .deb e subir um agente (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y ./target/${{ matrix.target }}/release/bundle/deb/*.deb
          python3 scripts/smoke-install.py /usr/bin/aisense-app

      - name: Fumaça — o .app do pacote sobe um agente (macOS)
        if: runner.os == 'macOS'
        run: |
          app=$(ls -d target/${{ matrix.target }}/release/bundle/macos/*.app | head -1)
          python3 scripts/smoke-install.py "$app/Contents/MacOS/aisense-app"

      - name: Fumaça — instalar pelo NSIS e subir um agente (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList '/S' -Wait
          python scripts/smoke-install.py "$env:LOCALAPPDATA\AISENSE\aisense-app.exe"

      - name: Pacotes do ensaio
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: pacotes-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/bundle/deb/*.deb
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
            target/${{ matrix.target }}/release/bundle/msi/*.msi
          retention-days: 7

  publish:
    name: Publicar
    needs: [draft, build]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Tirar do rascunho
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${{ needs.draft.outputs.release_id }}" \
            -F draft=false -F prerelease=${{ contains(github.ref_name, '-') }}
