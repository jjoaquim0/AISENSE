[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/jjoaquim0/AISENSE"
authors = ["AISENSE"]

[workspace.dependencies]
aisense-core = { path = "crates/aisense-core" }
aisense-pty = { path = "crates/aisense-pty" }
aisense-store = { path = "crates/aisense-store" }
aisense-ipc = { path = "crates/aisense-ipc" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = "11"
ulid = "1"
toml = "0.9"
regex = "1"
vt100 = "0.16"
notify = "8"
getrandom = "0.3"
tokio-util = "0.7"
portable-pty = "0.9"
bytes = "1"
base64 = "0.22"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
panic = "abort"

# portable-pty com as flags do ConPTY corrigidas para o Windows 10 (ver vendor/portable-pty/AISENSE.md).
[patch.crates-io]
portable-pty = { path = "vendor/portable-pty" }
