<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Ícone do AISENSE. Cores derivadas dos tokens de marca em tokens.css
       (brand-500 e brand-700 convertidos de OKLCH para hex). -->
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8171f5"/>
      <stop offset="1" stop-color="#5641b9"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" rx="228" fill="url(#fundo)"/>

  <!-- Prompt de terminal: o chevron e o cursor. Traço grosso para continuar
       legível a 16px, que é onde ícone bonito costuma virar borrão. -->
  <g fill="none" stroke="#ffffff" stroke-width="72"
     stroke-linecap="round" stroke-linejoin="round">
    <polyline points="330,360 470,512 330,664"/>
    <line x1="558" y1="664" x2="722" y2="664"/>
  </g>
</svg>
