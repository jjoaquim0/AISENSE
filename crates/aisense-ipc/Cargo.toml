[package]
name = "aisense-ipc"
description = "Servidor de socket local (NDJSON) do barramento."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
aisense-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# `net`: Unix domain socket e named pipe do próprio tokio — sem crate nova para o transporte.
tokio = { workspace = true, features = ["net", "io-util", "rt", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net"] }
tempfile = "3"
ulid.workspace = true
