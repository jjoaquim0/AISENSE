[package]
name = "aisense-mcp"
description = "Servidor MCP stdio que expõe o barramento como ferramentas."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "aisense-mcp"
path = "src/main.rs"

[dependencies]
aisense-core.workspace = true
serde.workspace = true
serde_json.workspace = true
aisense-ipc.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "io-std", "time"] }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time", "net", "process", "io-util"] }
tokio-util.workspace = true
tempfile = "3"
