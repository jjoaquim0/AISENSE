document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  <div style=\"display:flex; flex-direction:column; gap:16px\">\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">01 — Símbolo<\u002Fspan>\n        <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:40px; font-weight:650; letter-spacing:-.03em; line-height:1.05\">Elo<\u002Fh2>\n        <p style=\"margin:0; font-size:16px; line-height:1.65; color:#3A3F3C; text-wrap:pretty\">Três nós ligados formam uma equipe e um “A” aberto. Os dois nós de baixo são as pessoas e as contas. O nó verde no topo é a IA que coordena o time. O verde aparece só nesse ponto.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF; border-radius:24px; aspect-ratio:4/3; display:grid; place-items:center; color:#0C0F0D\">\n        <svg width=\"46%\" height=\"46%\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:32px\">\n      <div style=\"display:flex; flex-direction:column; gap:12px; max-width:640px\">\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">02 — Logo completo<\u002Fspan>\n        <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:40px; font-weight:650; letter-spacing:-.03em; line-height:1.05\">Símbolo + escrita<\u002Fh2>\n        <p style=\"margin:0; font-size:16px; line-height:1.65; color:#3A3F3C; text-wrap:pretty\">Sempre em minúsculas. O ponto do “i” é verde e repete o nó do símbolo. A versão horizontal é a principal; a vertical serve para espaços quadrados.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px\">\n        <div style=\"background:#0C0F0D; color:#F5F6F4; border-radius:24px; min-height:280px; display:flex; align-items:center; justify-content:center; gap:16px\">\n          <svg width=\"56\" height=\"56\"><use href=\"#elo\"><\u002Fuse><\u002 :14px; color:#3A3F3C\"><strong>Principal<\u002Fstrong> — fundo claro<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px\">\n          <div style=\"background:#0C0F0D; border-radius:18px; height:140px; display:flex; align-items:center; justify-content:center; gap:10px; color:#FFFFFF\"><svg width=\"36\" height=\"36\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'Bricolage Grotesque', sans-serif; font-weight:650; font-size:36px; letter-spacing:-.04em; line-height:1; padding-bottom:3px\">a<span style=\"position:relative; display:inline-block\">ı<span style=\"position:absolute; left:50%; top:.035em; width:.2em; height:.2em; border-radius:50%; background:#2EE68A; transform:translateX(-50%)\"><\u002Fspan><\u002Fspan>sense<\u002Fspan><\u002Fdiv>\n          <span style=\"font-size:14px; color:#3A3F3C\"><strong>Negativa<\u002Fstrong> — interface escura<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px\">\n          <div style=\"--acc:#0C0F0D; background:#2EE68A; border-radius:18px; height:140px; display:flex; align-items:center; justify-content:center; gap:10px; color:#0C0F0D\"><svg width=\"36\" height=\"36\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'Bricolage Grotesque', sans-serif; font-weight:650; font-size:36px; letter-spacing:-.04em; line-height:1; padding-bottom:3px\">aisense<\u002Fspan><\u002Fdiv>\n          <span style=\"font-size:14px; color:#3A3F3C\"><strong>Monocromática<\u002Fstrong> — sobre o verde ou impressão em uma cor<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:32px\">\n      <div style=\"display:flex; flex-direction:column; gap:12px; max-width:640px\">\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">03 — Cores<\u002Fspan>\n        <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:40px; font-weight:650; letter-spacing:-.03em; line-height:1.05\">Preto na maior parte, verde como sinal<\u002Fh2>\n        <p style=\"margin:0; font-size:16px; line-height:1.65; color:#3A3F3C; text-wrap:pretty\">Em uma tela, cerca de 85% é tinta e papel e no máximo 5% é verde. Use o verde em um botão principal, num status “ativo” ou num destaque. Nunca como fundo de seções grandes.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(170px,1fr)); gap:12px\">\n        <sc-for list=\"{{ colors }}\" as=\"c\" hint-placeholder-count=\"7\">\n          <div style=\"display:flex; flex-direction:column; gap:12px\">\n            <div style=\"height:150px; border-radius:18px; background:{{ c.hex }}; box-shadow:inset 0 0 0 1px rgba(12,15,13,.08)\"><\u002Fdiv>\n            <div style=\"display:flex; flex-direction:column; gap:3px\">\n              <strong style=\"font-size:15px\">{{ c.name }}<\u002Fstrong>\n              <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#3A3F3C\">{{ c.hex }} · {{ c.rgb }}<\u002Fspan>\n              <span style=\"font-size:13px; line-height:1.5; color:#5B615D\">{{ c.use }}<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:32px\">\n      <div style=\"display:flex; flex-direction:column; gap:12px; max-width:640px\">\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">04 — Tipografia<\u002Fspan>\n        <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:40px; font-weight:650; letter-spacing:-.03em; line-height:1.05\">Três fontes, papéis claros<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:16px\">\n        <div style=\"background:#FFFFFF; border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:20px\">\n          <span style=\"font-family:'Bricolage Grotesque', sans-serif; font-weight:650; font-size:72px; letter-spacing:-.04em; line-height:1\">Aa<\u002Fspan>\n          <div style=\"display:flex; flex-direction:column; gap:4px\"><strong>Bricolage Grotesque<\u002Fstrong><span style=\"font-size:14px; line-height:1.55; color:#3A3F3C\">Títulos e escrita do logo. Peso 600–700, espaçamento −3% a −4%.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:20px\">\n          <span style=\"font-family:'Plus Jakarta Sans', sans-serif; font-weight:500; font-size:72px; letter-spacing:-.02em; line-height:1\">Aa<\u002Fspan>\n          <div style=\"display:flex; flex-direction:column; gap:4px\"><strong>Plus Jakarta Sans<\u002Fstrong><span style=\"font-size:14px; line-height:1.55; color:#3A3F3C\">Textos, interface, botões. Peso 400–600, corpo 15–18px.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border-radius:24px; padding:28px; display:flex; flex-direction:column; gap:20px\">\n          <span style=\"font-family:'JetBrains Mono', monospace; font-weight:500; font-size:72px; line-height:1\">Aa<\u002Fspan>\n          <div style=\"display:flex; flex-direction:column; gap:4px\"><strong>JetBrains Mono<\u002Fstrong><span style=\"font-size:14px; line-height:1.55; color:#3A3F3C\">Rótulos, IDs de agentes, código e números técnicos.<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF; border-radius:24px; padding:clamp(24px,4vw,48px); display:flex; flex-direction:column; gap:14px\">\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; letter-spacing:.08em; text-transform:uppercase; color:#087A42\">Agentes · Equipes · Kanban<\u002Fspan>\n        <span style=\"font-family:'Bricolage Grotesque', sans-serif; font-weight:700; font-size:clamp(36px,5vw,60px); line-height:1; letter-spacing:-.04em; text-wrap:balance\">Monte sua equipe de IA em minutos.<\u002Fspan>\n        <span style=\"font-size:18px; line-height:1.6; color:#3A3F3C; max-width:560px; text-wrap:pretty\">Crie agentes, organize-os em times, gerencie contas e acompanhe cada tarefa no kanban — tudo num só lugar.<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:48px\">\n      <div style=\"display:flex; flex-direction:column; gap:20px\">\n        <div style=\"display:flex; flex-direction:column; gap:12px\">\n          <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">05 — Área de proteção<\u002Fspan>\n          <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:32px; font-weight:650; letter-spacing:-.03em\">Deixe o logo respirar<\u002Fh2>\n          <p style=\"margin:0; font-size:15px; line-height:1.65; color:#3A3F3C; text-wrap:pretty\">Mantenha em volta do logo um espaço livre de pelo menos <strong>x<\u002Fstrong>, que é o diâmetro do nó verde. Nenhum texto ou imagem entra nessa área.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border-radius:24px; padding:40px; display:grid; place-items:center\">\n          <div style=\"position:relative; padding:24px; outline:1.5px dashed #2EE68A; outline-offset:0; display:flex; align-items:center; gap:12px; background:repeating-linear-gradient(45deg, rgba(46,230,138,.10) 0 6px, transparent 6px 12px)\">\n            <div style=\"background:#FFFFFF; display:flex; align-items:center; gap:12px\">\n              <svg width=\"48\" height=\"48\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg>\n              <span style=\"font-family:'Bricolage Grotesque', sans-serif; font-weight:650; font-size:48px; line-height:1; letter-spacing:-.04em; padding-bottom:4px\">a<span style=\"position:relative; display:inline-block\">ı<span style=\"position:absolute; left:50%; top:.035em; width:.2em; height:.2em; border-radius:50%; background:#2EE68A; transform:translateX(-50%)\"><\u002Fspan><\u002Fspan>sense<\u002Fspan>\n            <\u002Fdiv>\n            <span style=\"position:absolute; top:4px; left:6px; font-family:'JetBrains Mono', monospace; font-size:11px; color:#087A42\">x<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex; flex-direction:column; gap:20px\">\n        <div style=\"display:flex; flex-direction:column; gap:12px\">\n          <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">06 — Tamanho mínimo<\u002Fspan>\n          <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:32px; font-weight:650; letter-spacing:-.03em\">Pequeno, mas legível<\u002Fh2>\n          <p style=\"margin:0; font-size:15px; line-height:1.65; color:#3A3F3C; text-wrap:pretty\">Símbolo sozinho: mínimo de 16px. Logo completo: mínimo de 88px de largura. Abaixo disso, use só o símbolo.<\u002Fp>\n        <\u002Fdiv>\n        <div style=\"background:#FFFFFF; border-radius:24px; padding:40px; display:flex; align-items:flex-end; justify-content:center; gap:32px; flex-wrap:wrap\">\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px\"><svg width=\"16\" height=\"16\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#5B615D\">16px<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px\"><svg width=\"32\" height=\"32\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#5B615D\">32px<\u002Fspan><\u002Fdiv>\n          <div style=\"display:flex; flex-direction:column; align-items:center; gap:10px\"><div style=\"display:flex; align-items:center; gap:4px\"><svg width=\"18\" height=\"18\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><span style=\"font-family:'Bricolage Grotesque', sans-serif; font-weight:650; font-size:18px; letter-spacing:-.04em; line-height:1; padding-bottom:2px\">aisense<\u002Fspan><\u002Fdiv><span style=\"font-family:'JetBrains Mono', monospace; font-size:11px; color:#5B615D\">88px<\u002Fspan><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:32px\">\n      <div style=\"display:flex; flex-direction:column; gap:12px; max-width:640px\">\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">07 — Ícone de app e redes<\u002Fspan>\n        <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:40px; font-weight:650; letter-spacing:-.03em; line-height:1.05\">Fundo preto, símbolo branco<\u002Fh2>\n        <p style=\"margin:0; font-size:16px; line-height:1.65; color:#3A3F3C; text-wrap:pretty\">O símbolo ocupa cerca de 56% do quadrado. Para avatar em redes, use o mesmo ícone num círculo.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"background:#FFFFFF; border-radius:24px; padding:40px; display:flex; align-items:center; gap:28px; flex-wrap:wrap\">\n        <div style=\"width:128px; height:128px; border-radius:30px; background:#0C0F0D; color:#FFFFFF; display:grid; place-items:center\"><svg width=\"72\" height=\"72\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"width:128px; height:128px; border-radius:50%; background:#0C0F0D; color:#FFFFFF; display:grid; place-items:center\"><svg width=\"68\" height=\"68\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"--acc:#0C0F0D; width:128px; height:128px; border-radius:30px; background:#2EE68A; color:#0C0F0D; display:grid; place-items:center\"><svg width=\"72\" height=\"72\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"width:64px; height:64px; border-radius:15px; background:#0C0F0D; color:#FFFFFF; display:grid; place-items:center\"><svg width=\"36\" height=\"36\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n        <div style=\"width:32px; height:32px; border-radius:7px; background:#0C0F0D; color:#FFFFFF; display:grid; place-items:center\"><svg width=\"24\" height=\"24\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:flex; flex-direction:column; gap:32px\">\n      <div style=\"display:flex; flex-direction:column; gap:12px; max-width:640px\">\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">08 — Não faça<\u002Fspan>\n        <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:40px; font-weight:650; letter-spacing:-.03em; line-height:1.05\">Usos incorretos<\u002Fh2>\n      <\u002Fdiv>\n      <div style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px\">\n        <div style=\"display:flex; flex-direction:column; gap:10px\"><div style=\"background:#FFFFFF; border-radius:18px; height:150px; display:grid; place-items:center; color:#0C0F0D\"><svg width=\"64\" height=\"64\" style=\"transform:scaleX(1.6)\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font-size:14px; color:#3A3F3C\">Não distorça nem estique<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px\"><div style=\"--acc:#FF5A36; background:#FFFFFF; border-radius:18px; height:150px; display:grid; place-items:center; color:#3355FF\"><svg width=\"64\" height=\"64\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font-size:14px; color:#3A3F3C\">Não troque as cores<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px\"><div style=\"background:#FFFFFF; border-radius:18px; height:150px; display:grid; place-items:center; color:#0C0F0D\"><svg width=\"64\" height=\"64\" style=\"transform:rotate(180deg)\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font-size:14px; color:#3A3F3C\">Não gire o símbolo<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px\"><div style=\"background:#FFFFFF; border-radius:18px; height:150px; display:grid; place-items:center; color:#0C0F0D\"><svg width=\"64\" height=\"64\" style=\"filter:drop-shadow(4px 6px 4px rgba(0,0,0,.45))\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font-size:14px; color:#3A3F3C\">Não adicione sombras ou efeitos<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px\"><div style=\"background:#FFFFFF; border-radius:18px; height:150px; display:grid; place-items:center; color:#0C0F0D\"><span style=\"font-family:'Plus Jakarta Sans', sans-serif; font-weight:800; font-size:34px\">AISENSE<\u002Fspan><\u002Fdiv><span style=\"font-size:14px; color:#3A3F3C\">Não escreva em caixa alta nem troque a fonte<\u002Fspan><\u002Fdiv>\n        <div style=\"display:flex; flex-direction:column; gap:10px\"><div style=\"background:#2EE68A; border-radius:18px; height:150px; display:grid; place-items:center; color:#0C0F0D\"><svg width=\"64\" height=\"64\"><use href=\"#elo\"><\u002Fuse><\u002Fsvg><\u002Fdiv><span style=\"font-size:14px; color:#3A3F3C\">Não use o nó verde sobre fundo verde<\u002Fspan><\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <section style=\"display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:48px\">\n      <div style=\"display:flex; flex-direction:column; gap:16px\">\n        <span style=\"font-family:'JetBrains Mono', monospace; font-size:12px; color:#5B615D\">09 — Arquivos<\u002Fspan>\n        <h2 style=\"margin:0; font-family:'Bricolage Grotesque', sans-serif; font-size:32px; font-weight:650; letter-spacing:-.03em\">Para começar o site<\u002Fh2>\n        <div style=\"display:flex; flex-direction:column; gap:10px; font-size:15px\">\n          <a href=\"logo/aisense-simbolo.svg\">aisense-simbolo.svg — fundo claro<\u002Fa>\n          <a href=\"logo/aisense-simbolo-branco.svg\">aisense-simbolo-branco.svg — fundo escuro<\u002Fa>\n          <a href=\"logo/aisense-simbolo-mono.svg\">aisense-simbolo-mono.svg — uma cor<\u002Fa>\n          <a href=\"logo/aisense-icone-app.svg\">aisense-icone-app.svg — ícone de app<\u002Fa>\n          <a href=\"logo/favicon.svg\">favicon.svg<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fdiv>\n      <pre style=\"margin:0; background:#0C0F0D; color:#E3E7E4; border-radius:24px; padding:28px; font-family:'JetBrains Mono', monospace; font-size:13px; line-height:1.75; overflow:auto\">{{ css }}<\u002Fpre>\n    <\u002Fsection>\n  <\u002Fmain>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  renderVals() {\n    return {\n      colors: [\n        { name: 'Tinta', hex: '#0C0F0D', rgb: '12 15 13', use: 'Cor principal. Logo, textos e fundos escuros.' },\n        { name: 'Grafite', hex: '#1A1F1C', rgb: '26 31 28', use: 'Cards e painéis na interface escura.' },\n        { name: 'Cinza', hex: '#5B615D', rgb: '91 97 93', use: 'Texto secundário e legendas.' },\n        { name: 'Névoa', hex: '#D9DCD8', rgb: '217 220 216', use: 'Bordas e divisões suaves.' },\n        { name: 'Papel', hex: '#F5F6F4', rgb: '245 246 244', use: 'Fundo claro do site.' },\n        { name: 'Verde aisense', hex: '#2EE68A', rgb: '46 230 138', use: 'Acento. Nó do logo, botão principal, status ativo.' },\n        { name: 'Verde texto', hex: '#087A42', rgb: '8 122 66', use: 'Links e texto verde sobre fundo claro.' }\n      ],\n      css: `:root {\n  --ink:        #0C0F0D;\n  --graphite:   #1A1F1C;\n  --gray:       #5B615D;\n  --mist:       #D9DCD8;\n  --paper:      #F5F6F4;\n  --green:      #2EE68A;\n  --green-text: #087A42;\n\n  --font-display: 'Bricolage Grotesque', sans-serif;\n  --font-body:    'Plus Jakarta Sans', sans-serif;\n  --font-mono:    'JetBrains Mono', monospace;\n\n  --radius-sm: 10px;\n  --radius-md: 18px;\n  --radius-lg: 24px;\n}`\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
